[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-ratings"
version = "1.0.0"
description = "Rating pipeline for competitive debating: Tabbycat ingest, TrueSkill Through Time fit, explorer payload"
requires-python = ">=3.11"
dependencies = [
    "debaterskill",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "brotli>=1.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8"]
ml = ["torch>=2.2", "transformers>=4.40", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM118"]
ignore = ["B023", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
