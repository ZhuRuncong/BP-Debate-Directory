name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "debaterskill @ git+https://github.com/ZhuRuncong/debaterskill@main"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cp -r site server/site
      - run: cd server && go mod tidy && go vet ./... && go build ./...
